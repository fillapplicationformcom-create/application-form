<script>
"use strict";

const API_BASE =
  "https://application-form-qtxc.onrender.com";

const adminSession =
  sessionStorage.getItem("adminSession");

if (!adminSession) {

  window.location.href =
    "admin-login.html";

}


/*
 * Use the existing server session for API requests.
 */
async function apiRequest(url, options = {}) {

  const headers = {
    ...(options.headers || {}),
    "Accept": "application/json",
    "Content-Type": "application/json",
    "Authorization":
      "Bearer " + adminSession
  };

  const response =
    await fetch(
      API_BASE + url,
      {
        ...options,
        headers
      }
    );

  const contentType =
    response.headers.get("content-type") || "";

  let result = null;

  if (contentType.includes("application/json")) {
    result = await response.json();
  } else {
    const text = await response.text();

    if (!response.ok) {
      throw new Error(
        text || "Server request failed."
      );
    }

    return text;
  }

  if (response.status === 401 ||
      response.status === 403) {

    sessionStorage.removeItem("adminSession");
    sessionStorage.removeItem("adminAuthenticated");

    window.location.href =
      "admin-login.html";

    return null;
  }

  if (!response.ok) {

    throw new Error(
      result?.error ||
      result?.message ||
      "Server request failed."
    );
  }

  return result;
}
</script>
