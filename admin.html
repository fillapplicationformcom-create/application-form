<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Administrator Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(
      135deg,
      #eef3ff,
      #f8f9fc
    );
  color: #172033;
}

.card {
  width: min(430px, 92%);
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow:
    0 15px 45px rgba(20,40,80,.12);
}

h1 {
  margin: 0 0 8px;
}

p {
  color: #64748b;
  line-height: 1.5;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: 700;
}

input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  font: inherit;
}

input {
  border: 1px solid #ccd3df;
}

button {
  margin-top: 18px;
  border: 0;
  background: #2563eb;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 9px;
  background: #eff6ff;
  color: #1e40af;
}

.error {
  background: #fef2f2;
  color: #b91c1c;
}
</style>
</head>

<body>

<main class="card">

  <h1>Administrator Login</h1>

  <p>
    Authorized administrators only.
  </p>

  <form id="loginForm">

    <label for="adminToken">
      Administrator Token
    </label>

    <input
      id="adminToken"
      type="password"
      autocomplete="current-password"
      required>

    <button
      id="loginButton"
      type="submit">

      Sign In

    </button>

  </form>

  <div
    id="status"
    class="status">
  </div>

</main>

<script>
"use strict";

const form =
  document.getElementById(
    "loginForm"
  );

const tokenInput =
  document.getElementById(
    "adminToken"
  );

const button =
  document.getElementById(
    "loginButton"
  );

const status =
  document.getElementById(
    "status"
  );


function showStatus(
  message,
  error = false
) {

  status.textContent =
    message;

  status.className =
    "status" +
    (error ? " error" : "");

  status.style.display =
    "block";
}


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const token =
      tokenInput.value.trim();

    if (!token) {
      showStatus(
        "Enter the administrator token.",
        true
      );
      return;
    }

    button.disabled = true;
    button.textContent =
      "Signing in...";

    try {

      /*
       * The server-side login endpoint will
       * validate this token and return a
       * short-lived session.
       */

      const response =
        await fetch(
          "/api/admin/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              token
            })
          }
        );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Authentication failed."
        );
      }

      /*
       * Store only the short-lived session
       * token returned by the server.
       */

      sessionStorage.setItem(
        "adminSession",
        result.token
      );

      window.location.href =
        "admin.html";

    } catch (error) {

      showStatus(
        error.message ||
        "Unable to sign in.",
        true
      );

      button.disabled = false;
      button.textContent =
        "Sign In";
    }

  }

<script>
/* =========================================================
   WRT / AUTHORIZED ACCESS CONTROLS
   CONSENT-BASED ACCESS ONLY
========================================================= */

function addAccessControls(article, application) {

  if (
    article.querySelector(
      ".access-control-section"
    )
  ) {
    return;
  }

  const section =
    document.createElement("div");

  section.className =
    "section access-control-section";

  section.innerHTML = `
    <div class="section-title">
      Authorized Access
    </div>

    <div style="
      font-size:12px;
      color:#64748b;
      margin-bottom:10px;
      line-height:1.5;
    ">
      Access requests require explicit authorization.
      Camera, microphone and screen permissions are controlled
      by the user's browser and cannot be silently granted.
    </div>

    <div class="permissions">

      <div
        class="permission not-granted"
        data-access-status="wrt">
        Authorization: Not confirmed
      </div>

      <div
        class="permission not-granted"
        data-access-status="camera">
        Camera: Not authorized
      </div>

      <div
        class="permission not-granted"
        data-access-status="microphone">
        Microphone: Not authorized
      </div>

      <div
        class="permission not-granted"
        data-access-status="screen">
        Screen: Not authorized
      </div>

    </div>

    <div style="
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    ">

      <button
        type="button"
        class="small"
        data-access-action="wrt">
        Request Authorization
      </button>

      <button
        type="button"
        class="small"
        data-access-action="camera"
        disabled>
        Camera
      </button>

      <button
        type="button"
        class="small"
        data-access-action="microphone"
        disabled>
        Microphone
      </button>

      <button
        type="button"
        class="small"
        data-access-action="screen"
        disabled>
        Screen
      </button>

    </div>

    <div
      data-access-message
      style="
        margin-top:10px;
        font-size:12px;
        font-weight:600;
        color:#475569;
      ">
      Waiting for user authorization.
    </div>
  `;

  article.appendChild(section);

  const authorizationButton =
    section.querySelector(
      '[data-access-action="wrt"]'
    );

  const cameraButton =
    section.querySelector(
      '[data-access-action="camera"]'
    );

  const microphoneButton =
    section.querySelector(
      '[data-access-action="microphone"]'
    );

  const screenButton =
    section.querySelector(
      '[data-access-action="screen"]'
    );

  const message =
    section.querySelector(
      "[data-access-message]"
    );


  /* =======================================================
     REQUEST EXPLICIT AUTHORIZATION
  ======================================================= */

  authorizationButton.addEventListener(
    "click",
    async () => {

      authorizationButton.disabled = true;

      message.textContent =
        "Sending authorization request...";

      try {

        const result =
          await apiRequest(
            "/api/admin/applications/" +
            encodeURIComponent(
              application.id
            ) +
            "/access-request",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                type: "wrt",
                applicationId:
                  application.id
              })
            }
          );

        if (!result) {
          return;
        }

        message.textContent =
          "Authorization request sent. Waiting for explicit approval.";

      } catch(error) {

        console.error(
          "Authorization request:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to send authorization request.";

        authorizationButton.disabled =
          false;
      }
    }
  );


  /* =======================================================
     CAMERA
     This requests permission on the CURRENT browser only.
  ======================================================= */

  cameraButton.addEventListener(
    "click",
    async () => {

      try {

        message.textContent =
          "Requesting camera permission...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        setAccessStatus(
          section,
          "camera",
          true,
          "Camera permission granted by this browser."
        );

      } catch(error) {

        console.error(error);

        setAccessStatus(
          section,
          "camera",
          false,
          "Camera permission was denied or unavailable."
        );
      }
    }
  );


  /* =======================================================
     MICROPHONE
  ======================================================= */

  microphoneButton.addEventListener(
    "click",
    async () => {

      try {

        message.textContent =
          "Requesting microphone permission...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: true
          });

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        setAccessStatus(
          section,
          "microphone",
          true,
          "Microphone permission granted by this browser."
        );

      } catch(error) {

        console.error(error);

        setAccessStatus(
          section,
          "microphone",
          false,
          "Microphone permission was denied or unavailable."
        );
      }
    }
  );


  /* =======================================================
     SCREEN
     Browser always shows its own screen-share dialog.
  ======================================================= */

  screenButton.addEventListener(
    "click",
    async () => {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
      ) {

        message.textContent =
          "Screen sharing is not supported by this browser.";

        return;
      }

      try {

        message.textContent =
          "Opening browser screen-sharing dialog...";

        const stream =
          await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false
          });

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        setAccessStatus(
          section,
          "screen",
          true,
          "Screen-sharing permission granted by this browser."
        );

      } catch(error) {

        console.error(error);

        setAccessStatus(
          section,
          "screen",
          false,
          "Screen sharing was cancelled or denied."
        );
      }
    }
  );


  /* =======================================================
     ENABLE AFTER EXPLICIT AUTHORIZATION
  ======================================================= */

  section.enableAuthorizedAccess =
    function() {

      authorizationButton.disabled =
        true;

      cameraButton.disabled =
        false;

      microphoneButton.disabled =
        false;

      screenButton.disabled =
        false;

      setAccessStatus(
        section,
        "wrt",
        true,
        "Authorization confirmed. Browser permissions are still required."
      );
    };
}


/* =========================================================
   ACCESS STATUS
========================================================= */

function setAccessStatus(
  section,
  type,
  granted,
  message
) {

  const element =
    section.querySelector(
      `[data-access-status="${type}"]`
    );

  if (!element) {
    return;
  }

  element.classList.remove(
    "granted",
    "not-granted"
  );

  element.classList.add(
    granted
      ? "granted"
      : "not-granted"
  );

  const names = {
    wrt: "Authorization",
    camera: "Camera",
    microphone: "Microphone",
    screen: "Screen"
  };

  element.textContent =
    names[type] +
    ": " +
    (
      granted
        ? "Authorized"
        : "Not authorized"
    );

  if (message) {

    const messageElement =
      section.querySelector(
        "[data-access-message]"
      );

    if (messageElement) {

      messageElement.textContent =
        message;
    }
  }
}


/* =========================================================
   PATCH APPLICATION RENDERING
========================================================= */

const originalRenderApplications =
  renderApplications;

renderApplications =
  function(applications) {

    originalRenderApplications(
      applications
    );

    const articles =
      listElement.querySelectorAll(
        ".application"
      );

    applications.forEach(
      (application, index) => {

        const article =
          articles[index];

        if (!article) {
          return;
        }

        addAccessControls(
          article,
          application
        );
      }
    );
  };


/* =========================================================
   OPTIONAL: POLL AUTHORIZATION STATUS
========================================================= */

async function checkAuthorizationStatus(
  application,
  section
) {

  try {

    const result =
      await apiRequest(
        "/api/admin/applications/" +
        encodeURIComponent(
          application.id
        ) +
        "/access-status"
      );

    if (!result) {
      return;
    }

    if (
      result.wrt === true ||
      result.authorized === true
    ) {

      if (
        typeof section.enableAuthorizedAccess ===
        "function"
      ) {

        section.enableAuthorizedAccess();
      }
    }

  } catch(error) {

    console.warn(
      "Authorization status unavailable:",
      error
    );
  }
}


/* =========================================================
   START AUTHORIZATION STATUS CHECK
========================================================= */

function initializeAuthorizationChecks() {

  const articles =
    listElement.querySelectorAll(
      ".application"
    );

  articles.forEach(
    article => {

      const applicationId =
        article
          .querySelector(
            ".files-section"
          )
          ?.dataset
          ?.applicationId;

      if (!applicationId) {
        return;
      }

      const section =
        article.querySelector(
          ".access-control-section"
        );

      if (!section) {
        return;
      }

      checkAuthorizationStatus(
        {
          id: applicationId
        },
        section
      );

    }
  );
}
</script>

</body>
</html>
