<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Admin</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#eef3f8;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#173b8f,#2563eb);
  color:#fff;
  padding:22px 18px;
  box-shadow:0 4px 20px rgba(15,35,80,.15);
}

header h1{
  margin:0 0 5px;
  font-size:22px;
}

header p{
  margin:0;
  font-size:12px;
  opacity:.9;
}

.container{
  width:min(1200px,94%);
  margin:20px auto 50px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
  color:#fff;
  background:#2563eb;
  font-family:inherit;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

button.danger{
  background:#dc2626;
}

button.dark{
  background:#25334a;
}

button.green{
  background:#15803d;
}

button.small{
  padding:7px 10px;
  font-size:12px;
}

.status{
  padding:11px 13px;
  background:#eff6ff;
  color:#1e40af;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
}

.status.error{
  background:#fef2f2;
  color:#b91c1c;
}

.status.success{
  background:#ecfdf3;
  color:#15803d;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 6px 25px rgba(20,40,80,.08);
}

.card h2{
  margin:0 0 10px;
  font-size:18px;
}

.application{
  border:1px solid #dfe5ed;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
  background:#fff;
}

.application-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.form-number{
  font-size:16px;
  font-weight:800;
  color:#173b8f;
}

.saved-time{
  font-size:11px;
  color:#64748b;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px;
}

.field{
  background:#f8fafc;
  border-radius:9px;
  padding:10px;
  min-width:0;
}

.label{
  font-size:10px;
  color:#64748b;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.value{
  font-size:13px;
  font-weight:600;
  word-break:break-word;
  overflow-wrap:anywhere;
}

.section{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #e5e7eb;
}

.section-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.permissions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}

.permission{
  padding:10px;
  border-radius:9px;
  background:#f8fafc;
  font-size:12px;
  font-weight:700;
}

.permission.granted{
  background:#ecfdf3;
  color:#15803d;
}

.permission.not-granted{
  background:#fff7ed;
  color:#c2410c;
}

.files{
  display:grid;
  gap:8px;
}

.file{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid #e2e8f0;
  border-radius:9px;
  background:#fafcff;
}

.file-info{
  min-width:0;
  flex:1;
}

.file-name{
  font-weight:700;
  font-size:12px;
  word-break:break-all;
}

.file-meta{
  font-size:10px;
  color:#64748b;
  margin-top:3px;
  line-height:1.5;
}

.notes{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#f8fafc;
  border-radius:9px;
  padding:11px;
  font-size:12px;
  line-height:1.5;
  min-height:20px;
}

.empty{
  color:#64748b;
  text-align:center;
  padding:30px;
}

.loading{
  color:#64748b;
  padding:15px 0;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  background:#eff6ff;
  color:#1e40af;
  font-size:10px;
  font-weight:800;
  margin-top:5px;
}

.hidden{
  display:none;
}

@media(max-width:600px){

  .container{
    width:96%;
  }

  header{
    padding:18px 14px;
  }

  .card{
    padding:13px;
  }

  .application{
    padding:12px;
  }

  .file{
    align-items:stretch;
    flex-direction:column;
  }

  .file button{
    width:100%;
  }

  .toolbar button{
    flex:1 1 auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>Application Admin</h1>
  <p>Authorized application management dashboard</p>
</header>

<main class="container">

  <div class="toolbar">

    <button
      type="button"
      id="refreshButton">
      Refresh Applications
    </button>

    <button
      type="button"
      class="dark"
      id="refreshFilesButton">
      Refresh Files
    </button>

    <button
      type="button"
      class="danger"
      id="logoutButton">
      Sign Out
    </button>

  </div>

  <div
    id="status"
    class="status">
    Checking administrator session...
  </div>

  <section class="card">

    <h2>Applications</h2>

    <div id="applicationList">
      <div class="loading">
        Loading...
      </div>
    </div>

  </section>

</main>

<script>
"use strict";

/* =========================================================
   SESSION
========================================================= */

const SESSION_KEY = "adminSession";

const session =
  sessionStorage.getItem(SESSION_KEY);

const statusElement =
  document.getElementById("status");

const listElement =
  document.getElementById("applicationList");

const refreshButton =
  document.getElementById("refreshButton");

const refreshFilesButton =
  document.getElementById("refreshFilesButton");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "normal"
){

  statusElement.textContent =
    message;

  statusElement.className =
    "status";

  if(type === "error"){
    statusElement.classList.add(
      "error"
    );
  }

  if(type === "success"){
    statusElement.classList.add(
      "success"
    );
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(value){

  if(
    value === undefined ||
    value === null ||
    String(value).trim() === ""
  ){
    return "—";
  }

  return escapeHTML(value);
}


/* =========================================================
   SESSION REDIRECT
========================================================= */

function redirectToLogin(){

  sessionStorage.removeItem(
    SESSION_KEY
  );

  window.location.replace(
    "admin-login.html"
  );
}


/* =========================================================
   API REQUEST HELPER
========================================================= */

async function apiRequest(
  url,
  options = {}
){

  const requestOptions = {
    ...options
  };

  const headers = {
    ...(options.headers || {})
  };

  headers["Authorization"] =
    "Bearer " + session;

  requestOptions.headers =
    headers;

  const response =
    await fetch(
      url,
      requestOptions
    );

  if(
    response.status === 401 ||
    response.status === 403
  ){

    redirectToLogin();

    return null;
  }

  let result = null;

  const contentType =
    response.headers.get(
      "content-type"
    ) || "";

  if(
    contentType.includes(
      "application/json"
    )
  ){

    try{

      result =
        await response.json();

    }catch{

      result = null;
    }

  }else{

    try{

      const text =
        await response.text();

      result = {
        ok:false,
        error:text ||
          "Invalid server response."
      };

    }catch{

      result = {
        ok:false,
        error:
          "Invalid server response."
      };
    }
  }

  if(!response.ok){

    throw new Error(
      result?.error ||
      "Request failed."
    );
  }

  return result;
}


/* =========================================================
   VERIFY SESSION
========================================================= */

async function verifySession(){

  if(!session){

    redirectToLogin();

    return false;
  }

  try{

    const result =
      await apiRequest(
        "/api/admin/status"
      );

    if(
      !result ||
      result.ok !== true
    ){

      redirectToLogin();

      return false;
    }

    showStatus(
      "Administrator session verified.",
      "success"
    );

    return true;

  }catch(error){

    console.error(
      "Session verification failed:",
      error
    );

    showStatus(
      "Administrator session is invalid or expired.",
      "error"
    );

    redirectToLogin();

    return false;
  }
}


/* =========================================================
   LOAD APPLICATIONS
========================================================= */

async function loadApplications(){

  if(!session){

    redirectToLogin();

    return;
  }

  refreshButton.disabled = true;
  refreshFilesButton.disabled = true;

  showStatus(
    "Loading applications..."
  );

  listElement.innerHTML =
    `
      <div class="loading">
        Loading applications...
      </div>
    `;

  try{

    const result =
      await apiRequest(
        "/api/admin/applications"
      );

    if(!result){

      return;
    }

    const applications =
      Array.isArray(
        result.applications
      )
        ? result.applications
        : [];

    renderApplications(
      applications
    );

    showStatus(
      `${applications.length} application(s) loaded.`,
      "success"
    );

  }catch(error){

    console.error(
      "Application loading error:",
      error
    );

    showStatus(
      error.message ||
      "Unable to load applications.",
      "error"
    );

    listElement.innerHTML =
      `
        <div class="empty">
          Unable to load applications.
        </div>
      `;

  }finally{

    refreshButton.disabled = false;
    refreshFilesButton.disabled = false;
  }
}


/* =========================================================
   RENDER APPLICATIONS
========================================================= */

function renderApplications(
  applications
){

  listElement.innerHTML = "";

  if(!applications.length){

    listElement.innerHTML =
      `
        <div class="empty">
          No applications found.
        </div>
      `;

    return;
  }

  applications.forEach(
    application => {

      const article =
        document.createElement(
          "article"
        );

      article.className =
        "application";

      const details =
        application.applicationDetails &&
        typeof application.applicationDetails === "object"
          ? application.applicationDetails
          : {};

      const permissions =
        application.permissions &&
        typeof application.permissions === "object"
          ? application.permissions
          : {};

      const accuracyConsent =
        Boolean(
          details.accuracyConsent
        );

      const usageConsent =
        Boolean(
          details.usageConsent
        );

      const camera =
        Boolean(
          permissions.camera
        );

      const microphone =
        Boolean(
          permissions.microphone
        );

      const screen =
        Boolean(
          permissions.screen
        );

      const filesSelected =
        Boolean(
          permissions.filesSelected
        );

      const fileCount =
        Number(
          permissions.fileCount || 0
        );

      article.innerHTML = `

        <div class="application-header">

          <div>

            <div class="form-number">
              ${displayValue(
                application.formNumber ||
                details.formNumber ||
                "No Form Number"
              )}
            </div>

            <div class="badge">
              ${displayValue(
                application.applicationType ||
                "basic-information"
              )}
            </div>

            <div class="saved-time">
              Application ID:
              ${displayValue(
                application.id
              )}
            </div>

            <div class="saved-time">
              Submission ID:
              ${displayValue(
                details.submissionId
              )}
            </div>

          </div>

          <div class="saved-time">
            ${displayValue(
              formatDateTime(
                application.savedAt
              )
            )}
          </div>

        </div>


        <div class="grid">

          <div class="field">
            <div class="label">
              Full Name
            </div>
            <div class="value">
              ${displayValue(
                application.fullName ||
                details.fullName
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Mobile
            </div>
            <div class="value">
              ${displayValue(
                application.phone ||
                details.mobile
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Email
            </div>
            <div class="value">
              ${displayValue(
                application.email ||
                details.email
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Date of Birth
            </div>
            <div class="value">
              ${displayValue(
                application.dob ||
                details.dateOfBirth
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Gender
            </div>
            <div class="value">
              ${displayValue(
                details.gender
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Contact Method
            </div>
            <div class="value">
              ${displayValue(
                details.contactMethod
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Occupation
            </div>
            <div class="value">
              ${displayValue(
                details.occupation
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Organization
            </div>
            <div class="value">
              ${displayValue(
                details.organization
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              City
            </div>
            <div class="value">
              ${displayValue(
                details.city
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              State
            </div>
            <div class="value">
              ${displayValue(
                details.state
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              Country
            </div>
            <div class="value">
              ${displayValue(
                details.country
              )}
            </div>
          </div>


          <div class="field">
            <div class="label">
              PIN / ZIP
            </div>
            <div class="value">
              ${displayValue(
                details.postalCode
              )}
            </div>
          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Address
          </div>

          <div class="notes">
            ${displayValue(
              details.address
            )}
          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Purpose / Reason
          </div>

          <div class="notes">
            ${displayValue(
              details.purpose
            )}
          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Signature
          </div>

          <div class="grid">

            <div class="field">

              <div class="label">
                Signature
              </div>

              <div class="value">
                ${displayValue(
                  details.signature
                )}
              </div>

            </div>

            <div class="field">

              <div class="label">
                Signature Date
              </div>

              <div class="value">
                ${displayValue(
                  details.signatureDate
                )}
              </div>

            </div>

          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Additional Notes
          </div>

          <div class="notes">
            ${displayValue(
              application.notes
            )}
          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Consent
          </div>

          <div class="permissions">

            <div class="permission ${
              accuracyConsent
                ? "granted"
                : "not-granted"
            }">

              Accuracy:
              ${
                accuracyConsent
                  ? "Confirmed"

              }

            </div>


            <div class="permission ${
              usageConsent
                ? "granted"
                : "not-granted"
            }">

              Data Usage:
              ${
                usageConsent
                  ? "Confirmed"
                  : "Not confirmed"
              }

            </div>

          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Authorized Access
          </div>

          <div class="permissions">

            <div class="permission ${
              camera
                ? "granted"
                : "not-granted"
            }">

              Camera:
              ${
                camera
                  ? "Authorized"
                  : "Not authorized"
              }

            </div>


            <div class="permission ${
              microphone
                ? "granted"
                : "not-granted"
            }">

              Microphone:
              ${
                microphone
                  ? "Authorized"
                  : "Not authorized"
              }

            </div>


            <div class="permission ${
              screen
                ? "granted"
                : "not-granted"
            }">

              Screen:
              ${
                screen
                  ? "Authorized"
                  : "Not authorized"
              }

            </div>


            <div class="permission ${
              filesSelected
                ? "granted"
                : "not-granted"
            }">

              Files:
              ${
                filesSelected
                  ? `${fileCount} selected`
                  : "None"
              }

          </div>

        </div>


        <div
          class="section files-section"
          data-application-id="${escapeHTML(
            application.id
          )}">

          <div class="section-title">
            Uploaded Files
          </div>

          <div class="files">

            <div class="loading">
              Loading files...
            </div>

        </div>

      `;

      listElement.appendChild(
        article
      );

      loadApplicationFiles(
        application.id,
        article
      );
    }
  );
}


/* =========================================================
   LOAD FILES
========================================================= */

async function loadApplicationFiles(
  applicationId,
  article
){

  const filesContainer =
    article.querySelector(
      ".files"
    );

  if(!filesContainer){
    return;
  }

  try{

    const result =
      await apiRequest(
        "/api/admin/applications/" +
        encodeURIComponent(
          applicationId
        ) +
        "/files"
      );

    if(!result){
      return;
    }

    const files =
      Array.isArray(result.files)
        ? result.files
        : [];

    if(!files.length){

      filesContainer.innerHTML =
        `
          <div class="empty">
            No files uploaded.
          </div>
        `;

      return;
    }

    filesContainer.innerHTML = "";

    files.forEach(
      file => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "file";

        row.innerHTML = `

          <div class="file-info">

            <div class="file-name">
              ${displayValue(
                file.filename
              )}
            </div>

            <div class="file-meta">

              Category:
              ${displayValue(
                file.fileCategory ||
                "other"
              )}

              &nbsp; • &nbsp;

              Type:
              ${displayValue(
                file.mimetype ||
                "Unknown type"
              )}

              &nbsp; • &nbsp;

              Size:
              ${formatBytes(
                Number(
                  file.size || 0
                )
              )}

              &nbsp; • &nbsp;

              Uploaded:
              ${displayValue(
                formatDateTime(
                  file.createdAt
                )
              )}

            </div>

          </div>

          <button
            type="button"
            class="small green download-button">

            Download

          </button>

        `;

        const downloadButton =
          row.querySelector(
            ".download-button"
          );

        downloadButton.addEventListener(
          "click",
          () => {

            downloadFile(
              file.id,
              file.filename
            );

          }
        );

        filesContainer.appendChild(
          row
        );

      }
    );

  }catch(error){

    console.error(
      "File loading error:",
      error
    );

    filesContainer.innerHTML =
      `
        <div class="empty">
          Unable to load files.
        </div>
      `;
  }
}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
  fileId,
  filename
){

  if(!session){

    redirectToLogin();

    return;
  }

  try{

    showStatus(
      "Preparing file download..."
    );

    const response =
      await fetch(
        "/api/admin/files/" +
        encodeURIComponent(
          fileId
        ),
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " + session
          }
        }
      );

    if(
      response.status === 401 ||
      response.status === 403
    ){

      redirectToLogin();

      return;
    }

    if(!response.ok){

      let message =
        "Unable to download file.";

      try{

        const contentType =
          response.headers.get(
            "content-type"
          ) || "";

        if(
          contentType.includes(
            "application/json"
          )
        ){

          const result =
            await response.json();

          message =
            result.error ||
            message;
        }

      }catch{}

      throw new Error(
        message
      );
    }

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      filename ||
      "download";

    link.style.display =
      "none";

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    setTimeout(
      () => {
        URL.revokeObjectURL(
          url
        );
      },
      1000
    );

    showStatus(
      "File downloaded successfully.",
      "success"
    );

  }catch(error){

    console.error(
      "File download error:",
      error
    );

    showStatus(
      error.message ||
      "Unable to download file.",
      "error"
    );
  }
}


/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(
  bytes
){

  const value =
    Number(bytes);

  if(
    !Number.isFinite(value) ||
    value <= 0
  ){

    return "0 B";
  }

  if(value < 1024){

    return (
      value.toFixed(0) +
      " B"
    );
  }

  if(
    value <
    1024 * 1024
  ){

    return (
      (value / 1024)
        .toFixed(1) +
      " KB"
    );
  }

  if(
    value <
    1024 * 1024 * 1024
  ){

    return (
      (value /
        (1024 * 1024))
        .toFixed(1) +
      " MB"
    );
  }

  return (
    (value /
      (1024 * 1024 * 1024))
      .toFixed(1) +
    " GB"
  );
}


/* =========================================================
   FORMAT DATE / TIME
========================================================= */

function formatDateTime(
  value
){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);
  }

  return date.toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  sessionStorage.removeItem(
    SESSION_KEY
  );

  window.location.replace(
    "admin-login.html"
  );
}
