<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">

<meta
  name="theme-color"
  content="#2563eb">

<meta
  name="mobile-web-app-capable"
  content="yes">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default">

<link
  rel="apple-touch-icon"
  href="./icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administrator Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#eef3ff,#f8f9fc);
  color: #172033;
}

.card {
  width: min(430px,92%);
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 15px 45px rgba(20,40,80,.12);
}

h1 {
  margin: 0 0 8px;
}

p {
  color: #64748b;
  line-height: 1.5;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: 700;
}

input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  font: inherit;
}

input {
  border: 1px solid #ccd3df;
}

button {
  margin-top: 18px;
  border: 0;
  background: #2563eb;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 9px;
  background: #eff6ff;
  color: #1e40af;
}

.error {
  background: #fef2f2;
  color: #b91c1c;
}
</style>
</head>

<body>

<main class="card">

  <h1>Administrator Login</h1>

  <p>Authorized administrators only.</p>

  <form id="loginForm">

    <label for="adminToken">
      Administrator Password / Token
    </label>

    <input
      id="adminToken"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginButton"
      type="submit">
      Sign In
    </button>

  </form>

  <div id="status" class="status"></div>

</main>

<script>
"use strict";

const API_BASE =
  "https://application-form-qtxc.onrender.com";

const form =
  document.getElementById("loginForm");

const tokenInput =
  document.getElementById("adminToken");

const button =
  document.getElementById("loginButton");

const status =
  document.getElementById("status");


function showStatus(message, error = false) {

  status.textContent = message;

  status.className =
    "status" + (error ? " error" : "");

  status.style.display = "block";
}


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const token =
    tokenInput.value.trim();

  if (!token) {
    showStatus(
      "Enter the administrator password/token.",
      true
    );
    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";

  status.style.display = "none";

  try {

    const response = await fetch(
      API_BASE + "/api/admin/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({
          token: token
        })
      }
    );

    const contentType =
      response.headers.get("content-type") || "";

    let result;

    if (contentType.includes("application/json")) {
      result = await response.json();
    } else {
      const text = await response.text();

      throw new Error(
        "Server returned a non-JSON response: " +
        text.substring(0, 150)
      );
    }

    if (!response.ok) {

      throw new Error(
        result.error ||
        result.message ||
        "Authentication failed."
      );
    }

    /*
     * Accept the common session-token
     * property names without changing server.js.
     */
    const sessionToken =
      result.token ||
      result.sessionToken ||
      result.accessToken;

    if (!sessionToken) {

      throw new Error(
        "Login succeeded but the server did not return a session token."
      );
    }

    sessionStorage.setItem(
      "adminSession",
      sessionToken
    );

    /*
     * Keep the token available to admin.html.
     */
    sessionStorage.setItem(
      "adminAuthenticated",
      "true"
    );

    showStatus(
      "Login successful. Opening administrator panel..."
    );

    setTimeout(function() {

      window.location.href = "admin.html";

    }, 300);

  } catch (error) {

    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );

    showStatus(
      error.message ||
      "Unable to connect to the administrator server.",
      true
    );

    button.disabled = false;
    button.textContent = "Sign In";
  }

});

</script>
<script>
"use strict";

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "Admin app service worker registered:",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Service worker registration failed:",
          error
        );
      });

  });
}
</script>
</body>
</html>
